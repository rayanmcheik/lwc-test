<template>
    <lightning-card title="Case Manager" icon-name="standard:case">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-input
                        label="Search by Case Number"
                        type="search"
                        value={searchInput}
                        onchange={handleSearchInput}
                        placeholder="Enter case number">
                    </lightning-input>
                </div>

                <div class="slds-col slds-align-bottom">
                    <lightning-button
                        label="Search"
                        variant="brand"
                        onclick={handleSearch}>
                    </lightning-button>

                    <lightning-button
                        label="Show All"
                        class="slds-m-left_small"
                        onclick={handleShowAll}>
                    </lightning-button>
                </div>
            </div>

            <div class="slds-box slds-m-bottom_large">

                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                    Create New Case
                </h2>

                <lightning-input
                    label="Subject"
                    value={subject}
                    onchange={handleSubjectChange}
                    required>
                </lightning-input>

                <lightning-textarea
                    label="Description"
                    value={description}
                    onchange={handleDescriptionChange}
                    class="slds-m-top_small">
                </lightning-textarea>

                <lightning-button
                    label="Create Case"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleCreateCase}
                    disabled={isCreating}>
                </lightning-button>

            </div>
            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                Cases
            </h2>

            <lightning-datatable
                key-field="Id"
                data={cases}
                columns={columns}
                is-loading={isLoading}
                hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>
</template>
