<template>
    <lightning-card title="Case Manager" icon-name="standard:case">
        <div class="slds-p-around_medium">

            <div class="search-container slds-m-bottom_large">
                <lightning-input
                    label="Search by Case Number"
                    type="search"
                    value={searchKey}
                    onchange={handleSearch}
                    placeholder="Enter case number">
                </lightning-input>

                <template if:true={searchKey}>
                    <lightning-datatable
                        class="slds-m-top_medium"
                        key-field="Id"
                        data={cases}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </template>
            </div>
            
            <div class="search-container slds-m-bottom_medium">
                <lightning-combobox
                    name="statusDropdown"
                    label="Search by Case Status"
                    value={searchKeyStatus}
                    placeholder="Select Case Status"
                    options={statusOptions}
                    onchange={handleSearchbyStatus}>
                </lightning-combobox>
          
                <lightning-datatable
                    class="slds-m-top_medium"
                    key-field="Id"
                    data={displayedCases}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>

            <div class="slds-box slds-m-top_large">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                    Create New Case
                </h2>

                <lightning-input
                    data-id="subject"
                    label="Subject"
                    value={subject}
                    onchange={handleSubjectChange}
                    required>
                </lightning-input>

                <lightning-textarea
                    label="Description"
                    value={description}
                    onchange={handleDescriptionChange}
                    class="slds-m-top_small">
                </lightning-textarea>

                <lightning-button
                    label="Create Case"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleCreateCase}
                    disabled={isCreating}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
