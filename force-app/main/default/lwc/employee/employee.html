<template> 
    <lightning-card title="Employee Management"> 
        <div class="container" style="padding: 50px; margin: 20px;"> 
            <lightning-combobox 
                label="Select Department" 
                value={selectedDepartment} 
                options={departmentOptions} 
                onchange={handleDepartmentChange}> 
            </lightning-combobox>          
            <lightning-button 
            style="margin-top: 20px;"
                class="button" 
                label="Show Employees" 
                variant="brand" 
                onclick={handleShowEmployees}> 
            </lightning-button>             
            <template if:true={showEmployees}> 
                <div class="employees slds-m-top_medium"> 
                    <h1>Employees</h1>                  
                    <template for:each={filteredEmployees} for:item="employee"> 
                        <div  key={employee.id} data-id={employee.id} onclick={handleEmployeeClick} style="display:flex;flex-direction:row ">
                            <c-card 
                                employee-name={employee.name}
                                employee-department={employee.department}
                                employee-position={employee.position}>
                            </c-card>
                        </div>
                    </template>                
                </div> 
            </template> 
            <template if:true={selectedEmployee}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <lightning-button-icon 
                                icon-name="utility:close" 
                                alternative-text="Close" 
                                title="Close" 
                                variant="bare-inverse" 
                                class="slds-modal__close" 
                                onclick={handleCloseModal}>
                            </lightning-button-icon>
                            <h2 class="slds-text-heading_medium slds-hyphenate">{selectedEmployee.name}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <p class="slds-m-bottom_small"><strong>Department:</strong> {selectedEmployee.department}</p>
                            <p class="slds-m-bottom_small"><strong>Position:</strong> {selectedEmployee.position}</p>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button 
                                label="Close" 
                                variant="neutral" 
                                onclick={handleCloseModal}>
                            </lightning-button>
                        </footer>                      
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template> 
        </div> 
    </lightning-card> 
</template>
