
<template>
    <div class="payment-details-container">
         <template if:true={isCash}>
<h3 class="slds-text-heading_medium slds-m-bottom_medium">
               Cash Payment
            </h3>               
         </template>
        <template if:true={isVisa}>

            <h3 class="slds-text-heading_medium slds-m-bottom_medium">
                Credit Card Information
            </h3>

            <!-- INTERACTIVE VISA CARD -->
            <div class="credit-card">

                <div class="card-top">
                    <span class="card-chip"></span>
                    <span class="card-brand">VISA</span>
                </div>

                <!-- CARD NUMBER INPUT -->
                <div class="card-number-area">
                    <label> CARD NUMBER </label>
                    <input
                        type="text"
                        class="card-number-input"
                        placeholder="0000 0000 0000 0000"
                        value={cardNumber}
                        maxlength="19"
                        inputmode="numeric"
                        autocomplete="off"
                        oninput={handleCardNumber}>
                </div>

                <div class="card-bottom">

                    <!-- CARDHOLDER -->
                    <div class="card-holder-area">
                        <label>CARDHOLDER</label>
                        <input
                            type="text"
                            class="card-holder-input"
                            placeholder="YOUR NAME"
                            value={cardholderName}
                            maxlength="26"
                            autocomplete="off"
                            oninput={handleCardholder}>
                    </div>

                    <!-- EXPIRY -->
                    <div class="card-expiry-area">
                        <label>EXPIRES</label>
                        <input
                            type="text"
                            class="card-expiry-input"
                            placeholder="MM/YY"
                            value={expiryDate}
                            maxlength="5"
                            inputmode="numeric"
                            autocomplete="off"
                            oninput={handleExpiry}>
                    </div>

                </div>

            </div>

            <!-- CVV -->
            <div class="cvv-container">

                <lightning-input
                    type="password"
                    label="CVV"
                    value={cvv}
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="off"
                    onchange={handleCvv}
                    message-when-value-missing="Enter CVV">
                </lightning-input>

            
            </div>

        </template>

        <!-- BANK TRANSFER -->
        <template if:true={isBankTransfer}>

            <h3 class="slds-text-heading_medium slds-m-bottom_medium">
                Bank Transfer Details
            </h3>

            <lightning-input
                label="Bank Name"
                data-field="bankName"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Transfer Reference"
                data-field="transferReference"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                type="date"
                label="Transfer Date"
                data-field="transferDate"
                onchange={handleChange}
                required>
            </lightning-input>

        </template>

        <!-- ONLINE PAYMENT -->
        <template if:true={isOnlinePayment}>

            <h3 class="slds-text-heading_medium slds-m-bottom_medium">
                Online Payment Details
            </h3>

            <lightning-input
                label="Payment Provider"
                data-field="provider"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Transaction Reference"
                data-field="transactionReference"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                type="date"
                label="Transaction Date"
                data-field="transactionDate"
                onchange={handleChange}
                required>
            </lightning-input>

        </template>

    </div>
</template>
