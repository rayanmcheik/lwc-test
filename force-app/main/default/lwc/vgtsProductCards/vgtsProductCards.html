<template>
    <div class="vgts-container">

        <div class="header">
            <h2>VGTS Travel Products</h2>
            <p>Available options for your destination</p>
        </div>

        <template if:true={hasProducts}>
            <div class="products-grid">

                <template for:each={products} for:item="p">
                    <article key={p.productId} class="product-card">

                        <div class="card-header">
                            <span>VGTS TRAVEL</span>
                            <span>{p.productType}</span>
                        </div>

                        <div class="card-body">

                            <h2>{p.name}</h2>

                            <p class="code">
                                Product Code: {p.productCode}
                            </p>

                            <div class="section-title">
                                TRAVEL DETAILS
                            </div>

                            <template if:true={p.departure}>
                                <p>Departure: {p.departure}</p>
                            </template>

                            <p>Destination: {p.destination}</p>

                            <template if:true={p.departureDate}>
                                <p>Departure Date: {p.departureDate}</p>
                            </template>

                            <template if:true={p.returnDate}>
                                <p>Return Date: {p.returnDate}</p>
                            </template>

                            <template if:true={p.flightType}>
                                <div class="section-title">
                                    FLIGHT DETAILS
                                </div>
                                <p>Flight Type: {p.flightType}</p>
                            </template>

                            <template if:true={p.cabinClass}>
                                <p>Cabin Class: {p.cabinClass}</p>
                            </template>

                            <template if:true={p.sellingPrice}>
                                <div class="price">
                                    {p.sellingPrice}
                                    {p.currencyCode}
                                </div>
                            </template>

                            <template if:true={p.fees}>
                                <p>Fees: {p.fees}</p>
                            </template>

                            <template if:true={p.taxes}>
                                <p>Taxes: {p.taxes}</p>
                            </template>

                            <template if:true={p.description}>
                                <div class="section-title">
                                    DESCRIPTION
                                </div>
                                <p>{p.description}</p>
                            </template>

                        </div>
                    </article>
                </template>

            </div>
        </template>

        <template if:false={hasProducts}>
            <p>No matching products found.</p>
        </template>

    </div>
</template>
