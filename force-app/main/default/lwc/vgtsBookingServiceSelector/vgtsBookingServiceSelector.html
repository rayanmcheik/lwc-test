
<template>
    <lightning-card title="VGTS Travel Packages" icon-name="standard:travel_mode">

        <div class="slds-p-around_medium">

            <div class="catalogue-toolbar slds-m-bottom_medium">
                <h2 class="catalogue-title">Explore Travel Packages</h2>
                <p class="slds-text-color_weak">
                    Select your travel services and save them to My Travel Package.
                </p>
            </div>

            <template lwc:if={loadError}>
                <div class="slds-notify slds-notify_alert slds-alert_error">
                    {loadError}
                </div>
            </template>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading products"></lightning-spinner>
            </template>

            <!-- PRODUCT CATALOGUE -->

            <lightning-tabset
                active-tab-value={activeTab}
                onselect={handleTabChange}>

                <!-- AIR TICKETS -->

                <lightning-tab label="Air Tickets" value="Air_Tickets">

                    <div class="slds-box slds-m-bottom_medium">

                        <h3 class="slds-text-heading_small slds-m-bottom_medium">
                            Search Flights
                        </h3>

                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-combobox
                                    label="Going From"
                                    value={filterOrigin}
                                    options={originOptions}
                                    data-field="filterOrigin"
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-combobox
                                    label="Going To"
                                    value={filterDestination}
                                    options={destinationOptions}
                                    data-field="filterDestination"
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-combobox
                                    label="Flight Type"
                                    value={filterFlightType}
                                    options={flightTypeOptions}
                                    data-field="filterFlightType"
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-combobox
                                    label="Cabin Class"
                                    value={filterCabinClass}
                                    options={cabinClassOptions}
                                    data-field="filterCabinClass"
                                    onchange={handleFilterChange}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-input
                                    type="number"
                                    label="Maximum Price"
                                    value={maxPrice}
                                    data-field="maxPrice"
                                    onchange={handleFilterChange}>
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-input
                                    type="search"
                                    label="Search Flights"
                                    value={searchKeyword}
                                    data-field="searchKeyword"
                                    onchange={handleFilterChange}>
                                </lightning-input>
                            </div>

                        </div>

                        <lightning-button
                            label="Clear Filters"
                            onclick={handleClearFilters}>
                        </lightning-button>

                    </div>

                    <template lwc:if={displayAirTickets.length}>

                        <div class="catalogue-grid">

                            <template for:each={displayAirTickets} for:item="item">

                                <article key={item.id} class="package-card">

                                    <div class="package-image-wrap">

                                        <template lwc:if={item.imageUrl}>
                                            <img src={item.imageUrl} alt={item.name} class="package-image"/>
                                        </template>

                                        <template lwc:else>
                                            <div class="package-image-placeholder">
                                                <lightning-icon icon-name="utility:world" size="large"></lightning-icon>
                                            </div>
                                        </template>

                                    </div>

                                    <div class="package-card-body">

                                        <h3 class="slds-text-heading_small">
                                            {item.name}
                                        </h3>

                                        <p>{item.origin} to {item.destination}</p>
                                        <p>{item.flightType} - {item.cabinClass}</p>
                                        <p class="package-description">{item.description}</p>

                                        <p class="package-price">
                                            <lightning-formatted-number
                                                value={item.price}
                                                format-style="currency"
                                                currency-code={item.currencyCode}>
                                            </lightning-formatted-number>
                                        </p>

                                        <div class="card-actions">

                                            <lightning-button
                                                label="View Details"
                                                data-id={item.id}
                                                onclick={handleSelectService}>
                                            </lightning-button>

                                            <lightning-button
                                                label="Add Flight"
                                                variant="brand"
                                                data-id={item.id}
                                                onclick={handleAddPackage}>
                                            </lightning-button>

                                        </div>

                                    </div>

                                </article>

                            </template>

                        </div>

                    </template>

                    <template lwc:else>
                        <div class="empty-state">
                            No Air Tickets found.
                        </div>
                    </template>

                </lightning-tab>

                <!-- HOTELS -->

                <lightning-tab label="Hotels" value="Hotels">

                    <div class="slds-box slds-m-bottom_medium">

                        <h3 class="slds-text-heading_small">
                            Find Hotels
                        </h3>

                        <lightning-combobox
                            label="Destination"
                            value={hotelDestinationFilter}
                            options={destinationOptions}
                            data-field="hotelDestinationFilter"
                            onchange={handleFilterChange}>
                        </lightning-combobox>

                        <lightning-input
                            type="search"
                            label="Search Hotels"
                            value={hotelSearchKeyword}
                            data-field="hotelSearchKeyword"
                            onchange={handleFilterChange}>
                        </lightning-input>

                        <lightning-button
                            label="Clear Hotel Search"
                            onclick={handleClearHotelFilters}>
                        </lightning-button>

                    </div>

                    <template lwc:if={displayHotels.length}>

                        <div class="package-grid">

                            <template for:each={displayHotels} for:item="item">

                                <article key={item.id} class="package-card">

                                    <div class="package-image-wrap">

                                        <template lwc:if={item.imageUrl}>
                                            <img src={item.imageUrl} alt={item.name} class="package-image"/>
                                        </template>

                                        <template lwc:else>
                                            <div class="package-image-placeholder">
                                                <lightning-icon icon-name="utility:home" size="large"></lightning-icon>
                                            </div>
                                        </template>

                                    </div>

                                    <div class="package-card-body">

                                        <h3>{item.name}</h3>

                                        <p>{item.destination}</p>
                                        <p>{item.description}</p>

                                        <lightning-input
                                            type="number"
                                            label="Number of Rooms"
                                            min="1"
                                            step="1"
                                            value={item.rooms}
                                            data-id={item.id}
                                            data-field="rooms"
                                            onchange={handleHotelQuantityChange}>
                                        </lightning-input>

                                        <lightning-input
                                            type="number"
                                            label="Number of Nights"
                                            min="1"
                                            step="1"
                                            value={item.nights}
                                            data-id={item.id}
                                            data-field="nights"
                                            onchange={handleHotelQuantityChange}>
                                        </lightning-input>

                                        <p class="package-price">
                                            Total:
                                            <lightning-formatted-number
                                                value={item.calculatedPrice}
                                                format-style="currency"
                                                currency-code={item.currencyCode}>
                                            </lightning-formatted-number>
                                        </p>

                                        <lightning-button
                                            label="Add Hotel"
                                            variant="brand"
                                            data-id={item.id}
                                            onclick={handleAddPackage}>
                                        </lightning-button>

                                    </div>

                                </article>

                            </template>

                        </div>

                    </template>

                    <template lwc:else>
                        <div class="empty-state">
                            No Hotels found.
                        </div>
                    </template>

                </lightning-tab>

                <!-- GROUND TRANSFERS -->

                <lightning-tab label="Ground Transfers" value="Ground">

                    <template lwc:if={displayTransfers.length}>

                        <div class="package-grid">

                            <template for:each={displayTransfers} for:item="item">

                                <article key={item.id} class="package-card">

                                    <div class="package-image-wrap">
                                        <template lwc:if={item.imageUrl}>
                                            <img src={item.imageUrl} alt={item.name} class="package-image"/>
                                        </template>
                                        <template lwc:else>
                                            <lightning-icon icon-name="utility:travel_and_places" size="large"></lightning-icon>
                                        </template>
                                    </div>

                                    <div class="package-card-body">

                                        <h3>{item.name}</h3>
                                        <p>{item.destination}</p>
                                        <p>{item.description}</p>

                                        <p class="package-price">
                                            <lightning-formatted-number
                                                value={item.price}
                                                format-style="currency"
                                                currency-code={item.currencyCode}>
                                            </lightning-formatted-number>
                                        </p>

                                        <lightning-button
                                            label="View Details"
                                            data-id={item.id}
                                            onclick={handleSelectService}>
                                        </lightning-button>

                                        <lightning-button
                                            label="Add Transfer"
                                            variant="brand"
                                            data-id={item.id}
                                            onclick={handleAddPackage}>
                                        </lightning-button>

                                    </div>

                                </article>

                            </template>

                        </div>

                    </template>

                    <template lwc:else>
                        <div class="empty-state">
                            No Ground Transfers found.
                        </div>
                    </template>

                </lightning-tab>

                <!-- ANCILLARY SERVICES -->

                <lightning-tab label="Ancillary Services" value="Ancillary">

                    <template lwc:if={displayAncillaries.length}>

                        <div class="package-grid">

                            <template for:each={displayAncillaries} for:item="item">

                                <article key={item.id} class="package-card">

                                    <div class="package-image-wrap">
                                        <template lwc:if={item.imageUrl}>
                                            <img src={item.imageUrl} alt={item.name} class="package-image"/>
                                        </template>
                                        <template lwc:else>
                                            <lightning-icon icon-name="utility:apps" size="large"></lightning-icon>
                                        </template>
                                    </div>

                                    <div class="package-card-body">

                                        <h3>{item.name}</h3>
                                        <p>{item.destination}</p>
                                        <p>{item.description}</p>

                                        <p class="package-price">
                                            <lightning-formatted-number
                                                value={item.price}
                                                format-style="currency"
                                                currency-code={item.currencyCode}>
                                            </lightning-formatted-number>
                                        </p>

                                        <lightning-button
                                            label="View Details"
                                            data-id={item.id}
                                            onclick={handleSelectService}>
                                        </lightning-button>

                                        <lightning-button
                                            label="Add Service"
                                            variant="brand"
                                            data-id={item.id}
                                            onclick={handleAddPackage}>
                                        </lightning-button>

                                    </div>

                                </article>

                            </template>

                        </div>

                    </template>

                    <template lwc:else>
                        <div class="empty-state">
                            No Ancillary Services found.
                        </div>
                    </template>

                </lightning-tab>

            </lightning-tabset>

            <!-- PRODUCT DETAILS -->

            <template lwc:if={selectedService}>

                <section class="details-panel slds-m-top_large">

                    <div class="details-heading">

                        <h2>Product Details</h2>

                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            onclick={handleCloseDetails}>
                        </lightning-button-icon>

                    </div>

                    <h3>{selectedService.name}</h3>

                    <p>{selectedService.description}</p>
                    <p>Destination: {selectedService.destination}</p>
                    <p>Supplier: {selectedService.supplier}</p>

                    <p class="package-price">
                        <lightning-formatted-number
                            value={selectedService.price}
                            format-style="currency"
                            currency-code={selectedService.currencyCode}>
                        </lightning-formatted-number>
                    </p>

                    <lightning-button
                        label="Add This Product"
                        variant="brand"
                        data-id={selectedService.id}
                        onclick={handleAddPackage}>
                    </lightning-button>

                </section>

            </template>

            <!-- MY TRAVEL PACKAGE -->

            <section class="selected-package-section slds-m-top_x-large">

                <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">

                    <h2 class="slds-text-heading_medium">
                        My Travel Package
                    </h2>

                    <lightning-button
                        label="Clear All"
                        onclick={handleClearPackage}
                        disabled={isSelectionEmpty}>
                    </lightning-button>

                </div>

                <template lwc:if={isSelectionEmpty}>

                    <div class="empty-state">

                        <lightning-icon
                            icon-name="utility:cart"
                            size="large">
                        </lightning-icon>

                        <p>No products selected yet.</p>

                    </div>

                </template>

                <template lwc:else>

                    <div class="selected-service-list">

                        <template for:each={services} for:item="service">

                            <div key={service.id} class="selected-service-row">

                                <div class="selected-service-info">

                                    <strong>{service.name}</strong>

                                    <p>
                                        {service.category} - {service.destination}
                                    </p>

                                    <p>{service.description}</p>

                                    <template lwc:if={service.hotelDescription}>
                                        <p>{service.hotelDescription}</p>
                                    </template>

                                </div>

                                <div class="selected-service-price">

                                    <strong>
                                        <lightning-formatted-number
                                            value={service.lineTotal}
                                            format-style="currency"
                                            currency-code={service.currencyCode}>
                                        </lightning-formatted-number>
                                    </strong>

                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Remove"
                                        data-id={service.id}
                                        onclick={handleRemoveService}>
                                    </lightning-button-icon>

                                </div>

                            </div>

                        </template>

                    </div>

                    <div class="total-panel slds-m-top_medium">

                        <span class="slds-text-heading_medium">
                            Total Price
                        </span>

                        <strong>

                            <lightning-formatted-number
                                value={totalPrice}
                                format-style="currency"
                                currency-code={totalCurrencyCode}>
                            </lightning-formatted-number>

                        </strong>

                    </div>

                    <template lwc:if={hasUnsavedChanges}>

                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_medium">
                            You have unsaved changes. Save Travel Package to keep your selections.
                        </div>

                    </template>

                    <template lwc:else>

                        <div class="slds-notify slds-notify_alert slds-alert_success slds-m-top_medium">
                            Your Travel Package is saved in Salesforce.
                        </div>

                    </template>

                    <div class="slds-m-top_medium">

                        <lightning-button
                            variant="brand"
                            label="Save Travel Package"
                            onclick={handleSavePackage}
                            disabled={savePackageDisabled}>
                        </lightning-button>

                        <lightning-button
                            variant="neutral"
                            label="Check Visa Requirements"
                            onclick={handleCheckVisa}
                            disabled={visaButtonDisabled}
                            class="slds-m-left_small">
                        </lightning-button>

                    </div>

                    <template lwc:if={isSaving}>
                        <lightning-spinner alternative-text="Saving package"></lightning-spinner>
                    </template>

                </template>

            </section>

            <!-- VISA VERIFICATION -->

            <section class="visa-section slds-box slds-theme_default slds-m-top_x-large">

                <h2 class="slds-text-heading_medium">
                    Visa Verification
                </h2>

                <p class="slds-text-color_weak slds-m-bottom_medium">
                    Check visa requirements for all saved destinations.
                </p>

                <template lwc:if={isCheckingVisa}>

                    <lightning-spinner
                        alternative-text="Checking Visa">
                    </lightning-spinner>

                </template>

                <template lwc:if={visaSummary}>

                    <p>
                        <strong>Visa Status:</strong>
                        {visaSummary.visaStatus}
                    </p>

                    <p>
                        <strong>Visa Required:</strong>
                        {visaSummary.visaRequired}
                    </p>

                    <template lwc:if={visaSummary.requirements}>

                        <div class="slds-m-top_medium">

                            <strong>Visa Information and Entry Conditions</strong>

                            <lightning-formatted-text
                                value={visaSummary.requirements}>
                            </lightning-formatted-text>

                        </div>

                    </template>

                </template>

                <template lwc:if={showVisaPendingInformation}>

                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_medium">

                        Visa verification has not been completed.
                        Save your Travel Package and click Check Visa Requirements.

                    </div>

                </template>

                <template lwc:if={showVisaFreeInformation}>

                    <div class="slds-notify slds-notify_alert slds-alert_success slds-m-top_medium">

                        Visa Free. Review the allowed stay, passport validity and destination entry requirements.

                    </div>

                </template>

                <!-- VISA FREE CHECKLIST -->

                <template for:each={visaFreeChecklistView} for:item="item">

                    <article key={item.Id} class="visa-checklist-card slds-m-top_medium">

                        <h3>
                            {item.Destination_Country__c}
                        </h3>

                        <lightning-badge label="Visa Free"></lightning-badge>

                        <p>
                            <strong>Allowed Stay:</strong>
                            {item.Allowed_Stay__c}
                        </p>

                        <p>
                            <strong>Notes:</strong>
                            {item.API_Notes__c}
                        </p>

                    </article>

                </template>

                <!-- VISA REQUIRED APPLICATION FORM -->

                <template lwc:if={showVisaRequiredInformation}>

                    <h3 class="slds-text-heading_medium slds-m-top_large">
                        Visa Application Information
                    </h3>

                    <p class="slds-text-color_weak">
                        Complete the application details for each destination.
                    </p>

                    <template for:each={visaChecklistView} for:item="item">

                        <template lwc:if={item.Visa_Required__c}>

                            <article key={item.Id} class="visa-checklist-card slds-m-top_medium">

                                <h3 class="slds-text-heading_small">
                                    Destination: {item.Destination_Country__c}
                                </h3>

                                <lightning-badge label={item.Status__c}></lightning-badge>

                                <p>Visa Type: {item.Visa_Type__c}</p>
                                <p>Allowed Stay: {item.Allowed_Stay__c}</p>
                                <p>{item.API_Notes__c}</p>

                                <div class="slds-grid slds-wrap slds-gutters">

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                                        <lightning-input
                                            label="Application Reference"
                                            value={item.applicationReference}
                                            data-id={item.Id}
                                            data-field="applicationReference"
                                            onchange={handleVisaFieldChange}>
                                        </lightning-input>

                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                                        <lightning-combobox
                                            label="Application Status"
                                            value={item.applicationStatus}
                                            options={visaApplicationStatusOptions}
                                            data-id={item.Id}
                                            data-field="status"
                                            onchange={handleVisaFieldChange}
                                            disabled={item.isApproved}>
                                        </lightning-combobox>

                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                                        <lightning-input
                                            type="date"
                                            label="Appointment Date"
                                            value={item.appointmentDate}
                                            data-id={item.Id}
                                            data-field="appointmentDate"
                                            onchange={handleVisaFieldChange}>
                                        </lightning-input>

                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                                        <lightning-input
                                            type="date"
                                            label="Submission Date"
                                            value={item.submissionDate}
                                            data-id={item.Id}
                                            data-field="submissionDate"
                                            onchange={handleVisaFieldChange}>
                                        </lightning-input>

                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                                        <lightning-input
                                            type="date"
                                            label="Decision Date"
                                            value={item.decisionDate}
                                            data-id={item.Id}
                                            data-field="decisionDate"
                                            onchange={handleVisaFieldChange}>
                                        </lightning-input>

                                    </div>

                                    <div class="slds-col slds-size_1-of-1">

                                        <lightning-input
                                            label="Comments"
                                            value={item.comments}
                                            data-id={item.Id}
                                            data-field="comments"
                                            onchange={handleVisaFieldChange}>
                                        </lightning-input>

                                    </div>

                                </div>

                                <h4 class="slds-text-heading_small slds-m-top_medium">
                                    Required Documents
                                </h4>

                                <lightning-input type="checkbox"
                                    label="Passport Copy Received"
                                    checked={item.passportCopyReceived}
                                    data-id={item.Id}
                                    data-field="passportCopyReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Passport Photo Received"
                                    checked={item.passportPhotoReceived}
                                    data-id={item.Id}
                                    data-field="passportPhotoReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Application Form Completed"
                                    checked={item.applicationFormCompleted}
                                    data-id={item.Id}
                                    data-field="applicationFormCompleted"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Flight Itinerary Received"
                                    checked={item.flightItineraryReceived}
                                    data-id={item.Id}
                                    data-field="flightItineraryReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Hotel Confirmation Received"
                                    checked={item.hotelConfirmationReceived}
                                    data-id={item.Id}
                                    data-field="hotelConfirmationReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Travel Insurance Received"
                                    checked={item.travelInsuranceReceived}
                                    data-id={item.Id}
                                    data-field="travelInsuranceReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Financial Proof Received"
                                    checked={item.financialProofReceived}
                                    data-id={item.Id}
                                    data-field="financialProofReceived"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-input type="checkbox"
                                    label="Appointment Completed"
                                    checked={item.appointmentCompleted}
                                    data-id={item.Id}
                                    data-field="appointmentCompleted"
                                    onchange={handleVisaFieldChange}>
                                </lightning-input>

                                <lightning-button
                                    class="slds-m-top_medium"
                                    variant="brand"
                                    label="Save Visa Information"
                                    data-id={item.Id}
                                    onclick={handleSaveVisaInformation}
                                    disabled={item.isApproved}>
                                </lightning-button>

                            </article>

                        </template>

                    </template>

                </template>

                <!-- PAYMENT -->

                <div class="slds-m-top_large">

                    <lightning-combobox
                        label="Payment Method"
                        value={paymentMethod}
                        options={paymentMethodOptions}
                        onchange={handlePaymentMethodChange}>
                    </lightning-combobox>

                    <lightning-button
                        label="Create Pending Payment"
                        onclick={handleRecordPayment}
                        disabled={isSaving}
                        class="slds-m-top_small">
                    </lightning-button>

                </div>

                <!-- QUOTE -->

                <div class="slds-m-top_large">

                    <lightning-button
                        variant="brand"
                        label="Create Quote"
                        onclick={handleCreateQuote}
                        disabled={quoteButtonDisabled}>
                    </lightning-button>

                    <template lwc:if={quoteButtonDisabled}>

                        <p class="slds-text-color_error slds-m-top_small">
                            {quoteBlockReason}
                        </p>

                    </template>

                </div>
